name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build for generic iOS device without signing
        run: >-
          xcodebuild
          -project SlawBot.xcodeproj
          -scheme SlawBot
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          'CODE_SIGN_IDENTITY='

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/SlawBot.app"
          test -d "$APP_PATH"
          mkdir -p dist/package/Payload
          cp -R "$APP_PATH" dist/package/Payload/
          (cd dist/package && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/dist/SlawBot-unsigned.ipa")
          unzip -l dist/SlawBot-unsigned.ipa | grep -q 'Payload/SlawBot.app/Info.plist'
          echo "Created unsigned IPA: dist/SlawBot-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SlawBot-unsigned-ipa
          path: dist/SlawBot-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
